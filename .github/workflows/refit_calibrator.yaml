name: Refit Calibrator

# Weekly: pull the bot's resolved-forecast track record, refit the per-category
# calibrator, and (only if leave-one-out Brier improves) commit the updated
# data/calibrators.json back to the repo. The bot reads that file at submit time
# (CALIBRATOR_PATH), so a deployed calibrator takes effect on the next run.
#
# Early on the track record is thin, the gate declines, nothing is committed,
# and the bot stays on raw probabilities — the safe default.
#
# PREREQUISITE: the pinned `superforecaster` dependency must include the
# forecaster.backtest.track_record / fit_calibrator modules. After pushing
# Superforecaster, run `poetry update superforecaster` in this repo and commit
# the updated poetry.lock.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 1" # Mondays 08:00 UTC

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write # needed to commit the refreshed calibrator

jobs:
  refit_job:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
          installer-parallel: true
      - name: Install dependencies
        run: poetry install --no-interaction --no-root
      - name: Collect track record + fit calibrator (gated on LOO Brier)
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
        run: |
          poetry run python -m forecaster.backtest.track_record --out data/track_record.json
          poetry run python -m forecaster.backtest.fit_calibrator data/track_record.json --out data/calibrators.json
      - name: Commit refreshed calibrator if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain data/calibrators.json)" ]; then
            git add -f data/calibrators.json
            git commit -m "chore: refit calibrator [skip ci]"
            git push
          else
            echo "No calibrator change to commit (gate declined or no new data)."
          fi
