[tool.poetry]
name = "metac-bot-template"
version = "0.1.0"
description = ""
authors = ["Vasile Popescu <elisescu@elisescu.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
python-decouple = "^3.8"
requests = "^2.32.3"
asknews = "^0.13.11"
numpy = "^2.3.0"
openai = "^2.0.0"
python-dotenv = "^1.0.1"
forecasting-tools = "^0.2.90"
# Superforecaster toolkit (calibrator, scoring, backtest). Git dependency so the
# CI runner can clone it; for fast local iteration you can temporarily swap to a
# path dep instead: { path = "../Superforecaster", develop = true }
superforecaster = { path = "../Superforecaster", develop = true }


[tool.poetry.group.integrations]
optional = true

[tool.poetry.group.integrations.dependencies]
lightningrod-ai = "^0.1.14"


[tool.poetry.group.dev.dependencies]
ipykernel = "^6.29.5"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

